[project]
name = "mojo-selectolax"
version = "0.1.0"
description = "Fast HTML parsing and CSS selection with Mojo kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "html", "css", "parser", "selectolax"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "selectolax"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
